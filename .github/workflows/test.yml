# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 14.x
      uses: actions/setup-node@v3
      with:
        node-version: 14.x
        cache: 'npm'
    - run: npm ci
    - run: npm test
    - name: Diagnose discovery fixture failures
      if: failure()
      run: |
        docker compose -f compose.yml ps || true
        docker compose -f compose.yml logs --tail=150 || true

  baseline-discovery-check:
    if: github.ref == 'refs/heads/fix/discovery-rescan'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d6c8d1cdd431bd82cbe23bf276d52cbb05a110e
      - uses: actions/setup-node@v4
        with:
          node-version: 14.x
          cache: npm
      - run: npm ci
      - name: Check previous deployed source against the same discovery fixture
        run: npm test -- --runInBand IntegrationTests
      - name: Diagnose baseline discovery fixture failures
        if: failure()
        run: |
          docker compose -f compose.yml ps || true
          docker compose -f compose.yml logs --tail=150 || true
