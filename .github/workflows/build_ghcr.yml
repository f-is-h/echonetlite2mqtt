name: Build GHCR image

on:
  workflow_dispatch:
  push:
    branches:
      - fix/discovery-rescan

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/echonetlite2mqtt

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=discovery-rescan
            type=ref,event=branch
            type=sha,prefix=discovery-rescan-

      - name: Write build info
        run: echo ref=${{ github.ref }}, sha=${{ github.sha }} > ./buildinfo

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
