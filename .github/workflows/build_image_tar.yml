name: Build Docker image tar

on:
  workflow_dispatch:
  push:
    branches:
      - fix/discovery-rescan

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify protocol and Docker discovery
        run: npm test -- --runInBand

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write build info
        run: echo ref=${{ github.ref }}, sha=${{ github.sha }} > ./buildinfo

      - name: Build image tar
        run: |
          VERSION=$(node -p "require('./package.json').version")
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --file dockerfile \
            --tag echonetlite2mqtt:discovery-rescan-${{ matrix.arch }} \
            --tag "echonetlite2mqtt:${VERSION}-${{ matrix.arch }}" \
            --output type=docker,dest=/tmp/echonetlite2mqtt-discovery-rescan-${{ matrix.arch }}.tar \
            .
          cd /tmp
          sha256sum echonetlite2mqtt-discovery-rescan-${{ matrix.arch }}.tar > echonetlite2mqtt-discovery-rescan-${{ matrix.arch }}.tar.sha256

      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: echonetlite2mqtt-discovery-rescan-${{ matrix.arch }}
          path: |
            /tmp/echonetlite2mqtt-discovery-rescan-${{ matrix.arch }}.tar
            /tmp/echonetlite2mqtt-discovery-rescan-${{ matrix.arch }}.tar.sha256
          retention-days: 7
